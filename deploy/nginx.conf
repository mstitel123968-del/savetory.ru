server {
    listen 80;
    server_name savetory.ru www.savetory.ru;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.savetory.ru$request_uri;
    }
}

map $uri $sklad_purchase_key {
    default "";
    /desktop/purchase/ $binary_remote_addr;
}
map $uri $sklad_status_key {
    default "";
    /desktop/status/ $binary_remote_addr;
}
limit_req_zone $sklad_purchase_key zone=sklad_purchase:10m rate=5r/m;
limit_req_zone $sklad_status_key zone=sklad_status:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name savetory.ru;
    limit_req zone=sklad_purchase burst=5 nodelay;
    limit_req zone=sklad_status burst=10 nodelay;
    limit_req_status 429;
    ssl_certificate /etc/letsencrypt/live/savetory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/savetory.ru/privkey.pem;

    # The desktop client posts here: a 301 would discard its request body.
    location /desktop/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        return 301 https://www.savetory.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.savetory.ru;
    limit_req zone=sklad_purchase burst=5 nodelay;
    limit_req zone=sklad_status burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 50m;
    ssl_certificate /etc/letsencrypt/live/savetory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/savetory.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /var/www/static/;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
