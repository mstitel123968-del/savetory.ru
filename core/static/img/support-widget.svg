<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dff1ff"></stop>
      <stop offset="55%" stop-color="#cfe7ff"></stop>
      <stop offset="100%" stop-color="#bddcff"></stop>
    </linearGradient>

    <radialGradient id="circleFill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#eaf7ff"></stop>
      <stop offset="65%" stop-color="#bfe0ff"></stop>
      <stop offset="100%" stop-color="#8cc5ff"></stop>
    </radialGradient>

    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f0ff"></stop>
      <stop offset="100%" stop-color="#4aa3ff"></stop>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8ec5ff" flood-opacity="0.28"></feDropShadow>
    </filter>

    <filter id="coinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#9b6a00" flood-opacity="0.35"></feDropShadow>
    </filter>

    <clipPath id="pillClip">
      <rect id="pillClipRect" x="322" y="20" width="96" height="100" rx="50">
        <animate attributeName="x" values="322;58;58;322" dur="3.6s" repeatCount="indefinite"></animate>
        <animate attributeName="width" values="96;360;360;96" dur="3.6s" repeatCount="indefinite"></animate>
      </rect>
    </clipPath>
  </defs>

  <!-- pill background -->
  <rect x="322" y="20" width="96" height="100" rx="50" fill="url(#pillFill)" stroke="url(#glassStroke)" stroke-width="3" filter="url(#softGlow)">
    <animate attributeName="x" values="322;58;58;322" dur="3.6s" repeatCount="indefinite"></animate>
    <animate attributeName="width" values="96;360;360;96" dur="3.6s" repeatCount="indefinite"></animate>
  </rect>

  <!-- inner stroke -->
  <rect x="330" y="28" width="80" height="84" rx="42" fill="none" stroke="#7bbcff" stroke-width="2" opacity="0.9">
    <animate attributeName="x" values="330;66;66;330" dur="3.6s" repeatCount="indefinite"></animate>
    <animate attributeName="width" values="80;344;344;80" dur="3.6s" repeatCount="indefinite"></animate>
  </rect>

  <!-- text area -->
  <g clip-path="url(#pillClip)">
    <text x="185" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e46a8" opacity="0">
      Поддержать
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="3.6s" repeatCount="indefinite"></animate>
      <animate attributeName="x" values="210;185;185;210" dur="3.6s" repeatCount="indefinite"></animate>
    </text>

    <text x="185" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e46a8" opacity="0">
      проект
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="3.6s" repeatCount="indefinite"></animate>
      <animate attributeName="x" values="210;185;185;210" dur="3.6s" repeatCount="indefinite"></animate>
    </text>
  </g>

  <!-- fixed glossy circle on right -->
  <g transform="translate(370 70)" filter="url(#softGlow)">
    <circle r="50" fill="url(#circleFill)" stroke="#63adff" stroke-width="5"></circle>
    <circle r="42" fill="none" stroke="#d8f2ff" stroke-width="2.5" opacity="0.85"></circle>

    <!-- glare -->
    <path d="M-26 -30 C-16 -42, 4 -44, 16 -36" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.28" stroke-linecap="round"></path>
    <circle cx="-18" cy="-20" r="4" fill="#fff6bf" opacity="0.7"></circle>
    <circle cx="20" cy="-14" r="3.3" fill="#fff6bf" opacity="0.7"></circle>

    <!-- heart -->
    <g transform="translate(0 -8)">
      <path d="M0 -7
               C0 -14, -10 -16, -14 -8
               C-17 -1, -8 6, 0 13
               C8 6, 17 -1, 14 -8
               C10 -16, 0 -14, 0 -7Z" fill="#e53935"></path>
    </g>

    <!-- 3 stacks of coins -->
    <g transform="translate(0 17)" filter="url(#coinShadow)">
      <!-- left -->
      <g transform="translate(-18 0)">
        <ellipse cx="0" cy="8" rx="12" ry="4" fill="#d89612"></ellipse>
        <rect x="-12" y="0" width="24" height="8" rx="3" fill="#f1b323"></rect>
        <ellipse cx="0" cy="0" rx="12" ry="4" fill="#ffd24d"></ellipse>
        <text x="0" y="3" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#c48300">₽</text>
      </g>

      <!-- center -->
      <g transform="translate(0 -2)">
        <ellipse cx="0" cy="10" rx="12" ry="4" fill="#d89612"></ellipse>
        <rect x="-12" y="1" width="24" height="9" rx="3" fill="#f1b323"></rect>
        <ellipse cx="0" cy="1" rx="12" ry="4" fill="#ffd24d"></ellipse>
        <text x="0" y="4" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#c48300">₽</text>
      </g>

      <!-- right -->
      <g transform="translate(18 0)">
        <ellipse cx="0" cy="8" rx="12" ry="4" fill="#d89612"></ellipse>
        <rect x="-12" y="0" width="24" height="8" rx="3" fill="#f1b323"></rect>
        <ellipse cx="0" cy="0" rx="12" ry="4" fill="#ffd24d"></ellipse>
        <text x="0" y="3" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#c48300">₽</text>
      </g>
    </g>
  </g>
</svg>