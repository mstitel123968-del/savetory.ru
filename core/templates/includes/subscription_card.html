{% if user.is_authenticated and app_subscription_plan %}
<section class="sidebar-tariff" aria-label="Текущий тариф">
  <div class="sidebar-tariff__name">
    <svg class="sidebar-tariff__crown" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="m3 7 4.5 4L12 4l4.5 7L21 7l-2 11H5L3 7Z" />
      <path d="M6 21h12" />
    </svg>
    <span>Тариф: {{ app_subscription_plan.name }}</span>
  </div>
  <div class="sidebar-tariff__usage">
    <strong data-sidebar-archive-used>{{ app_archive_used }}</strong>
    <span>/ {{ app_archive_limit_label }} карточек</span>
  </div>
  <div
    class="sidebar-tariff__progress"
    role="progressbar"
    aria-label="Использование архива"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="{{ app_archive_usage_percent }}"
    data-sidebar-archive-progress
    data-archive-limit="{{ app_archive_limit|default_if_none:'' }}"
  >
    <span style="--tariff-progress: {{ app_archive_usage_percent }}%" data-sidebar-archive-progress-bar></span>
  </div>
  <a class="sidebar-tariff__upgrade" href="{% url 'core:settings' %}#subscriptionPlans">Улучшить тариф</a>
</section>
{% endif %}
