{% if user.is_authenticated %}
<div class="app-account-controls">
  <button
    type="button"
    class="topbar-icon-button"
    aria-label="Уведомления"
    title="Уведомления"
    data-notification-placeholder
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
      <path d="M13.7 21a2 2 0 0 1-3.4 0" />
    </svg>
    <span class="topbar-icon-button__badge" data-notification-badge hidden></span>
  </button>
  <a
    class="topbar-icon-button"
    href="{% url 'core:messages' %}"
    aria-label="Сообщения"
    title="Сообщения"
    data-notification-channel="messages"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
    </svg>
    <span class="topbar-icon-button__badge" data-notification-badge hidden></span>
  </a>

  <div class="profile-menu" data-profile-menu>
    <button
      class="profile-menu__toggle"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
      data-profile-menu-toggle
    >
      <span class="profile-menu__avatar" aria-hidden="true">
        {% if user.profile.avatar_meta.avatar_data %}
          <img src="{{ user.profile.avatar_meta.avatar_data }}" alt="" />
        {% elif user.profile.avatar %}
          <img src="{{ user.profile.avatar.url }}" alt="" />
        {% else %}
          {{ user.username|slice:':1'|upper }}
        {% endif %}
      </span>
      <span class="profile-menu__name">{% firstof user.profile.display_name user.get_full_name user.username %}</span>
      <svg class="profile-menu__chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <div class="profile-menu__list" role="menu" hidden data-profile-menu-list>
      <a class="profile-menu__item" href="{% url 'core:profile' %}" role="menuitem">Мой профиль</a>
      <a class="profile-menu__item" href="{% url 'core:settings' %}" role="menuitem">Настройки</a>
      <div class="profile-menu__divider" aria-hidden="true"></div>
      <button class="profile-menu__item profile-menu__logout" type="button" role="menuitem" data-profile-logout>Выйти</button>
    </div>
  </div>
</div>
{% endif %}
