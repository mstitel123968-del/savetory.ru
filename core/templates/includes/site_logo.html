{% load static %}
<a class="brand-logo{% if brand_class %} {{ brand_class }}{% endif %}" href="{{ brand_href|default:'/' }}" aria-label="{{ brand_label|default:'Склад' }}">
  {% if brand_class == 'logo' %}
    <span class="sidebar-logo-container">
      <img class="sidebar-logo-image" src="{% static 'img/logo-sklad.png' %}" alt="{{ brand_label|default:'Склад' }}">
    </span>
    <span class="sr-only">{{ brand_label|default:'Склад' }}</span>
  {% elif brand_class == 'landing-brand' %}
    <span class="landing-logo-container">
      <img class="landing-logo-image" src="{% static 'img/logo-sklad.png' %}" alt="{{ brand_label|default:'Склад' }}">
    </span>
    <span class="sr-only">{{ brand_label|default:'Склад' }}</span>
  {% else %}
    <span class="brand-logo__text">{{ brand_label|default:'Склад' }}</span>
  {% endif %}
</a>
