version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://savetory.ru/subscriptions/payment/result/}
    depends_on:
      - db
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  db:
    image: postgres:16.3
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Direct access for database clients such as DBeaver.
    # Restrict TCP/5432 to trusted source IPs in the server firewall.
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/savetory/letsencrypt:/etc/letsencrypt:ro
      - /opt/savetory/certbot/www:/var/www/certbot:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

volumes:
  pg_data:
  static_data:
  media_data:
