name: savetory

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://savetory.ru/desktop/payment/result/}
      SKLAD_LICENSE_PRIVATE_KEY_FILE: /run/secrets/sklad-license.pem
      SKLAD_TRUST_PROXY_IP: "1"
    secrets:
      - source: sklad_license
        target: sklad-license.pem
    depends_on:
      - db
    volumes:
      - static_data:/app/staticfiles
      - ./downloads:/app/downloads:ro

  db:
    image: postgres:16.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/savetory/letsencrypt:/etc/letsencrypt:ro
      - /opt/savetory/certbot/www:/var/www/certbot:ro
      - static_data:/var/www/static:ro

volumes:
  pg_data:
  static_data:

secrets:
  sklad_license:
    file: ${SKLAD_LICENSE_KEY_HOST_FILE:-/opt/savetory/secrets/license-private.pem}
