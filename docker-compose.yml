services:
  web:
    build: .
    command: gunicorn trezo_site.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-only-insecure-key"
      POSTGRES_DB: trezo
      POSTGRES_USER: trezo
      POSTGRES_PASSWORD: trezo
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      YOOKASSA_ENABLED: "${YOOKASSA_ENABLED:-0}"
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      SITE_URL: "${SITE_URL:-http://localhost:8000}"
      YOOKASSA_RETURN_URL: "${YOOKASSA_RETURN_URL:-http://localhost:8000/subscriptions/payment/result/}"
      YOOKASSA_SEND_RECEIPT: "${YOOKASSA_SEND_RECEIPT:-0}"
      YOOKASSA_VAT_CODE: "${YOOKASSA_VAT_CODE:-}"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: trezo
      POSTGRES_USER: trezo
      POSTGRES_PASSWORD: trezo
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
