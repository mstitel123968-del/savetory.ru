services:
  web:
    build: .
    command: gunicorn trezo_site.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "changeme"
      POSTGRES_DB: trezo
      POSTGRES_USER: trezo
      POSTGRES_PASSWORD: trezo
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: trezo
      POSTGRES_USER: trezo
      POSTGRES_PASSWORD: trezo
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
