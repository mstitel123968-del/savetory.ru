services:
  web:
    build: .
    command: gunicorn trezo_site.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8001:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-only-insecure-key"
      POSTGRES_DB: trezo
      POSTGRES_USER: trezo
      POSTGRES_PASSWORD: trezo
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      SUPERUSER_LOGIN: "${SUPERUSER_LOGIN:-SuperUser}"
      SUPERUSER_PASSWORD: "${SUPERUSER_PASSWORD:-TS11181992SKlad}"
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      YOOKASSA_RETURN_URL: "${YOOKASSA_RETURN_URL:-http://localhost:8000/subscriptions/payment/result/}"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: trezo
      POSTGRES_USER: trezo
      POSTGRES_PASSWORD: trezo
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
