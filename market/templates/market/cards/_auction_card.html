{% load market_extras %}
<a class="market-card market-card--auction" href="{% url 'market_auction_detail' listing.id %}"
   data-listing-id="{{ listing.id }}" data-listing-type="auction">
  <div class="market-card__media">
    {% if listing.cover_url %}
      <img src="{{ listing.cover_url }}" alt="{{ listing.title|default:listing.item.title }}" loading="lazy" />
    {% else %}
      <div class="market-card__placeholder" aria-hidden="true">
        <span class="market-card__placeholder-icon">🖼️</span>
        <span class="market-card__placeholder-text">Без фото</span>
      </div>
    {% endif %}
  </div>
  <div class="market-card__body">
    <h3 class="market-card__title">{{ listing.title|default:listing.item.title }}</h3>
    <p class="market-card__price">
      <span class="market-card__price-amount">{% if listing.num_bids %}{{ listing.current_price|money }}{% else %}{{ listing.auction_start_price|money }}{% endif %}&nbsp;₽</span>
    </p>
  </div>
</a>
